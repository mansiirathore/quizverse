<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Quiz List</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: #38bdf8;
            margin-bottom: 30px;
        }

        .quiz-card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.4);
            margin: 20px auto;
            max-width: 700px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .quiz-card:hover {
            transform: scale(1.02);
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
        }

        .quiz-card h3 {
            margin: 0 0 10px;
            color: #38bdf8;
        }

        .quiz-info {
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        .btn {
            padding: 10px 18px;
            margin-right: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
            font-size: 0.9rem;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-take {
            background-color: #22c55e;
            color: white;
        }

        .btn-edit {
            background-color: #facc15;
            color: #1e293b;
        }

        .btn-delete {
            background-color: #ef4444;
            color: white;
        }

        .btn-home {
            display: block;
            margin: 30px auto 0;
            background-color: #3b82f6;
            color: white;
        }

        @media (max-width: 600px) {
            .btn {
                display: block;
                width: 100%;
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>

    <h1>📚 Available Quizzes</h1>
    <div id="quizList"></div>
    <button class="btn btn-home" onclick="location.href='index.html'">🏠 Home</button>

    <script>
        let quizzes = JSON.parse(localStorage.getItem('quizzes') || '[]');
        const container = document.getElementById('quizList');

        function renderQuizList() {
            container.innerHTML = '';
            if (quizzes.length === 0) {
                container.innerHTML = "<p style='text-align:center;'>📝 No quizzes available yet. Create one from the home page!</p>";
                return;
            }

            quizzes.forEach((quiz, index) => {
                const totalMarks = quiz.questions.reduce((sum, q) => sum + (parseInt(q.marks) || 1), 0);
                const div = document.createElement('div');
                div.className = 'quiz-card';
                div.innerHTML = `
          <h3>${quiz.title}</h3>
          <div class="quiz-info">🧩 Type: ${quiz.type || 'N/A'}</div>
          <div class="quiz-info">❓ Questions: ${quiz.questions.length}</div>
          <div class="quiz-info">🏅 Total Marks: ${totalMarks}</div>
          <button class="btn btn-take" onclick="startQuiz(${index})">▶️ Take</button>
          <button class="btn btn-edit" onclick="editQuiz(${index})">✏️ Edit</button>
          <button class="btn btn-delete" onclick="deleteQuiz(${index})">🗑️ Delete</button>
        `;
                container.appendChild(div);
            });
        }

        function startQuiz(index) {
            localStorage.setItem('selectedQuizIndex', index);
            localStorage.setItem('createdQuiz', JSON.stringify(quizzes[index]));
            window.location.href = 'take-quiz.html';
        }

        function editQuiz(index) {
            localStorage.setItem('editQuizIndex', index);
            window.location.href = 'quiz-creator.html';
        }

        function deleteQuiz(index) {
            if (confirm('Are you sure you want to delete this quiz?')) {
                quizzes.splice(index, 1);
                localStorage.setItem('quizzes', JSON.stringify(quizzes));
                renderQuizList();
            }
        }

        renderQuizList();
    </script>

</body>

</html>
